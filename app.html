<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lezan School Management System</title>
<meta name="description" content="Lezan English Private School &amp; Kindergarten — School Management System interface demo. Ten core modules, by Base Agency.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c2445'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='%23fecd08' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preload" href="static/fonts/BaseMeridionEnglish-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="static/fonts/BaseMeridionEnglish-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/css/tokens.css">
<link rel="stylesheet" href="static/css/app.css">
<link rel="stylesheet" href="static/css/charts.css">
<link rel="stylesheet" href="static/css/modules.css">
</head>
<body>

<a class="skip-link" href="#main" data-i18n="act.skipToContent">Skip to main content</a>

<div class="app">

  <!-- ===================== Sidebar ===================== -->
  <nav class="sidebar on-dark" id="sidebar" aria-label="Modules">
    <div class="sidebar__brand">
      <span class="sidebar__crest" aria-hidden="true">LZ</span>
      <span class="sidebar__wordmark">
        <span class="sidebar__name" data-i18n="app.schoolShort">Lezan Private School</span>
        <span class="sidebar__sub" data-i18n="app.tagline">School Management System</span>
      </span>
    </div>

    <div class="sidebar__scroll" id="navScroll"></div>

    <div class="sidebar__foot">
      <img src="static/img/base-logo-white.png" alt="">
      <span data-i18n="app.byBase">Built by Base Agency</span>
    </div>
  </nav>

  <!-- ===================== Main ===================== -->
  <div class="main">
    <header class="topbar">
      <button class="btn btn--icon topbar__menu" id="menuBtn" aria-label="Open navigation"
              aria-expanded="false" aria-controls="sidebar"></button>

      <div class="search hide-sm">
        <span class="search__icon" id="searchIcon"></span>
        <input type="search" id="globalSearch" autocomplete="off"
               placeholder="Search students, ID or guardian" aria-label="Search students">
      </div>

      <span class="topbar__spacer"></span>

      <span class="select hide-sm">
        <select id="yearSelect" aria-label="Academic year"></select>
      </span>

      <button class="btn btn--icon" id="langBtn" aria-label="Language" aria-haspopup="true" aria-expanded="false"></button>
      <button class="btn btn--icon" id="bellBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false"></button>
      <button class="btn btn--icon" id="userBtn" aria-label="Account" aria-haspopup="true" aria-expanded="false"
              style="width:auto;padding-inline:6px;gap:8px"></button>
    </header>

    <main class="content" id="main" tabindex="-1"></main>
  </div>
</div>

<div class="toaster" id="toaster" aria-live="polite" aria-atomic="false"></div>

<script src="static/js/icons.js"></script>
<script src="static/js/i18n.js"></script>
<script src="static/js/data.js"></script>
<script src="static/js/charts.js"></script>
<script src="static/js/ui.js"></script>

<script src="static/js/views/reports.js"></script>
<script src="static/js/views/admissions.js"></script>
<script src="static/js/views/students.js"></script>
<script src="static/js/views/attendance.js"></script>
<script src="static/js/views/timetable.js"></script>
<script src="static/js/views/exams.js"></script>
<script src="static/js/views/fees.js"></script>
<script src="static/js/views/staff.js"></script>
<script src="static/js/views/portal.js"></script>
<script src="static/js/views/comms.js"></script>

<script src="static/js/app.js"></script>
</body>
</html>
